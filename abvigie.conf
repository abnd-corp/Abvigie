# Configuration d'Abvigie.
#
# Priorité : valeurs par défaut < ce fichier < variables d'environnement (ABVIGIE_*) < arguments de la ligne de commande.
# Un réglage par ligne : « nom = valeur ». Un « # » commence un commentaire.
#
# JAMAIS de secret ici (R18). Le jeton GitHub en lecture seule se donne par la variable d'environnement GITHUB_TOKEN ;
# un réglage « jeton » dans ce fichier est refusé.

# L'organisation GitHub observée (lettres, chiffres, tirets).
organisation = abnd-corp

# Où le serveur écoute. En conteneur : 0.0.0.0:8080.
adresse = 127.0.0.1:8080

# L'adresse publique du site, sans « / » final : adresses canoniques, plan du site, données structurées, image de partage.
# Pour GitHub Pages : https://abnd-corp.github.io/Abvigie
url = http://localhost:8080

# Le délai entre deux lectures de GitHub : 90s, 15min, 6h, 1d (un nombre seul vaut des secondes ; 1 minute au minimum).
#
# Pour l'instant : 6 heures. Une lecture complète fait environ 2 requêtes par dépôt (33 pour 16 dépôts) ; sans jeton,
# GitHub n'en accepte que 60 par heure, donc 6 heures laissent de la marge.
#
# >>> POUR QUE LA PAGE SOIT À JOUR (presque en direct), METTRE 15min. <<<
# Il faut alors un jeton en lecture seule dans GITHUB_TOKEN : sans lui, une lecture toutes les 15 minutes finit par
# atteindre la limite de GitHub et laisse des dépôts illisibles (voir docs/deploiement.md).
rafraichir = 6h

# Jours sans activité avant que les lumières d'un bâtiment s'éteignent.
endormi_jours = 60

# Jours sans activité avant le drapeau de revue d'un projet dormant (charte, R26).
revue_jours = 180
