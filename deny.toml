# cargo-deny : licences, avis de sécurité, sources. Lancé par `make audit` et par la CI.
# Chaque licence autorisée est un choix : Abvigie est sous AGPL-3.0-or-later, ses dépendances doivent s'y combiner.
[licenses]
allow = [
    "AGPL-3.0-or-later",     # Abvigie lui-même : cargo-deny inspecte aussi le crate racine
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",   # données de certificats racine (webpki-roots)
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
